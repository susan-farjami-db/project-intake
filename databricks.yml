bundle:
  name: "project-intake"

sync:
  include:
    - .build

artifacts:
  default:
    # Bun 1.3 fails on OpenTelemetry SeverityNumber during Vite; Node Vite is used instead.
    build: node node_modules/vite/bin/vite.js build --config vite.config.ts --outDir ../__dist__ --emptyOutDir && apx build --skip-ui-build

variables:
  lakebase_project_id:
    description: Lakebase Autoscaling project that holds the intake database
    default: project-intake
  lakebase_branch:
    default: production
  lakebase_database:
    description: Database resource id on the branch (Postgres name databricks_postgres)
    default: databricks-postgres
  warehouse_id:
    description: SQL warehouse (serverless recommended) used for ai_classify

resources:
  postgres_projects:
    project-intake-db:
      project_id: ${var.lakebase_project_id}
      display_name: "project-intake"
      pg_version: 16
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: "300s"
      lifecycle:
        # Holds the intake requests; never let a bundle change drop it.
        prevent_destroy: true

  apps:
    project-intake-app:
      name: "project-intake"
      description: "AI Task Force project intake"
      source_code_path: ./.build
      resources:
        - name: "postgres"
          postgres:
            branch: projects/${resources.postgres_projects.project-intake-db.project_id}/branches/${var.lakebase_branch}
            database: projects/${resources.postgres_projects.project-intake-db.project_id}/branches/${var.lakebase_branch}/databases/${var.lakebase_database}
            permission: "CAN_CONNECT_AND_CREATE"
        - name: "sql-warehouse"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"

# Workspace-agnostic: pick the workspace with --profile (or DATABRICKS_HOST) and pass
# the warehouse with --var warehouse_id=<id> (or BUNDLE_VAR_warehouse_id=<id>).
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
